name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  container-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:container
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: crypto/age/go.mod
          cache-dependency-path: crypto/age/go.sum
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm test
      - run: npm run test:cli
